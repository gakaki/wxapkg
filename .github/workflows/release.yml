name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches mygo.json
        shell: bash
        run: |
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' mygo.json | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

  test:
    name: Test (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run MyGo UI vet
        run: go tool mygo vet .

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
            platform: darwin/universal
            artifact: wxapkg-macos-universal
            arch: universal
          - name: Windows x64
            os: ubuntu-latest
            platform: windows/amd64
            artifact: wxapkg-windows-amd64
            arch: amd64
          - name: Windows ARM64
            os: ubuntu-latest
            platform: windows/arm64
            artifact: wxapkg-windows-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS
        if: startsWith(matrix.platform, 'windows/')
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build native package
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            ./scripts/build-macos.sh
          else
            go tool mygo build -platform "${{ matrix.platform }}"
          fi

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            file="$(find build/darwin-universal -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          else
            file="$(find "build/windows-${{ matrix.arch }}" -maxdepth 1 -type f -name '*-setup-*.exe' -print -quit)"
          fi
          test -n "$file"
          cp "$file" release/
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 1
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release && sha256sum ./* > "SHA256SUMS-${{ matrix.artifact }}.txt")
          else
            (cd release && shasum -a 256 ./* > "SHA256SUMS-${{ matrix.artifact }}.txt")
          fi

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            使用 MyGo 原生 UI 构建，不包含 WebView。

            macOS 首次自动扫描微信目录时，请在“系统设置 → 隐私与安全性 → 完全磁盘访问权限”中添加并启用本应用。发布包未经过 Apple Developer ID 公证，首次打开可能需要在 Finder 中右键选择“打开”。重新授权一次后，后续未签名构建会保留授权；若从旧版升级后开关已打开仍无权限，请在应用内清除旧授权并重新添加。

            下载后可使用对应 `SHA256SUMS-*.txt` 校验安装包。
          files: dist/*
